<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대메추 | 대학교 메뉴 추천</title>
    <link rel="stylesheet" href="style.css">
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Three.js and Tween.js -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "@tweenjs/tween.js": "https://unpkg.com/@tweenjs/tween.js@23.1.1/dist/tween.esm.js"
        }
    }
    </script>
</head>
<body>
    <div id="app">
        <header class="glass-header">
            <h1 class="logo">대메추</h1>
            <p class="tagline">오늘 뭐 먹지? 캠퍼스 메뉴 추천</p>
        </header>

        <div id="map-container"></div>

        <div class="search-container">
            <div class="search-box">
                <input type="text" id="uni-search" placeholder="우리 대학교 검색하기..." autocomplete="off">
                <div id="search-results" class="search-results hidden"></div>
            </div>
        </div>

        <div class="info-panel hidden" id="info-panel">
            <h2 id="selected-uni-name"></h2>
            <p id="selected-uni-desc">이 대학교 주변의 맛집을 찾아보세요!</p>
            <button class="btn-recommend">추천 메뉴 보기</button>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
