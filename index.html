<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대메추 | 대학교 메뉴 추천</title>
    <link rel="stylesheet" href="style.css">
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body>
    <div id="app">
        <header class="header">
            <h1 class="logo">대메추</h1>
            <p class="tagline">캠퍼스 맛집 추천 서비스</p>
        </header>

        <div id="map-wrapper">
            <canvas id="map-canvas"></canvas>
        </div>

        <div class="search-overlay">
            <div class="search-bar">
                <input type="text" id="uni-search" placeholder="우리 대학교를 찾아보세요..." autocomplete="off">
                <div id="search-results" class="search-results hidden"></div>
            </div>
        </div>

        <div class="uni-card hidden" id="uni-card">
            <h2 id="card-title"></h2>
            <p id="card-region"></p>
            <button class="btn-primary">이 근처 뭐 먹지?</button>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
